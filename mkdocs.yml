site_name: Onyx Blades
site_url: https://wickdhub.com
site_description: Onyx Blades — an Elite Dangerous squadron. Live colonisation board, systems register, commander dossier and cohort uplink procedures.

theme:
  name: material
  custom_dir: overrides
  logo: blades/icon-192.png
  favicon: blades/icon-180.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
